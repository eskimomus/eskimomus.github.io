<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>matt swan</title>
    <!-- The logo in the default palette, so the tab has its icon from the
         first byte. app.js replaces it with one drawn to whatever palette the
         page is wearing, and keeps replacing it as that changes. -->
    <link rel="icon" type="image/png" href="./assets/favicon.png?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Tomorrow:wght@400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the design's scale factor before anything paints. Left to app.js
      // it would land after the first style resolution, and every element
      // that transitions a size — the logo above all — would visibly animate
      // from its unscaled size down to the right one on every page load.
      // 1200 is the cap, 1920 the design's own width, 0.7 the overall zoom
      // (landscape only — a portrait screen has no width to spare, so it
      // keeps the full scale). Past the cap the page stops growing and sits
      // centred, with background either side. Keep all three in step with
      // PAGE_MAX_WIDTH / PAGE_ZOOM / pageZoom in app.js.
      var root = document.documentElement;
      root.style.setProperty(
        "--scale",
        String(
          (Math.min(root.clientWidth, 1200) / 1920) *
            (root.clientHeight > root.clientWidth ? 1 : 0.7),
        ),
      );
      // The loading screen is the first thing painted, so the page has to be
      // out of sight before that paint rather than a frame after it. Set here
      // and cleared by app.js once everything has actually arrived.
      root.classList.add("is-booting");
    </script>
    <link rel="stylesheet" href="./styles.css?v=70" />
  </head>
  <body>
    <!-- The loading screen. It covers the page until every last image, the
         canvas layer and the first track have arrived, so the site is never
         seen half-built. The badge that turns here belongs to the cover and
         leaves with it; the page has a badge of its own. -->
    <div class="page-preloader" id="pagePreloader" role="status" aria-label="loading">
      <div class="page-preloader-mark" id="preloaderMark" aria-hidden="true"></div>
      <p class="page-preloader-note">
        this website contains a lot of stuff.<br />
        please wait a little until it’s fully downloaded
      </p>
    </div>

    <!-- Circles layer: pinned to the viewport, drawn through the scroll offset.
         pointer-events:none, so the page's own UI stays clickable. -->
    <canvas id="stage" aria-hidden="true"></canvas>

    <div class="page">
      <!-- The player's own canvas. It sits in the document flow, so the
           browser scrolls it along with everything else instead of us
           re-drawing it at a scroll offset the main thread only learns about
           a frame late. The field can't work that way — its bitmap would
           have to be as tall as the page — so it stays on #stage above. -->
      <canvas id="stagePlayer" aria-hidden="true"></canvas>
      <!-- Logo / now playing are one element in two states: idle it just
           hangs above the menu; once a track plays it rounds off, gains a
           background-coloured ring and sits on top of the spinning cover,
           with the track and its source alongside. -->
      <div class="brand" id="brand">
        <div class="brand-art" aria-hidden="true">
          <!-- the spin sits on its own element so the blob outline turns with
               the picture, and so the reveal's scale and the rotation aren't
               fighting over the same transform -->
          <div class="brand-art-spin"><img id="npArt" src="" alt="" /></div>
        </div>
        <div class="brand-logo" id="brandLogo" role="img" aria-label="matt swan"></div>
        <div class="np-meta">
          <span class="np-track" id="npTrack"></span>
          <span class="np-album" id="npAlbum"></span>
        </div>
      </div>

      <!-- the 7x7 dot cluster is drawn on the canvas, centered on this box -->
      <div class="player-mount" id="playerMount" aria-hidden="true"></div>

      <nav class="nav" aria-label="sections">
        <button class="nav-link" type="button" data-section="feed">feed</button>
        <button class="nav-link is-active" type="button" data-section="projects">projects</button>
        <button class="nav-link" type="button" data-section="all-music">all music</button>
        <button class="nav-link" type="button" data-section="contacts">contacts</button>
      </nav>

      <main class="content">
        <!-- Both tabs start at the same y (the .content padding), which is
             what keeps the collapsed headers in identical positions. The
             bits that sit above that line — the view toggle, the music
             sub-nav — are absolutely placed against .content. -->
        <section class="tab" data-tab="projects">
          <div class="view-toggle" role="group" aria-label="projects view">
            <button
              class="view-btn is-active"
              type="button"
              id="viewListBtn"
              data-view="list"
              aria-label="list view"
            ></button>
            <button
              class="view-btn"
              type="button"
              id="viewFieldBtn"
              data-view="field"
              aria-label="field view"
            ></button>
          </div>

          <div class="projects-list" id="projectsList"></div>

          <div class="projects-field" id="projectsField" hidden>
            <div class="field-mount" id="fieldMount" aria-hidden="true"></div>
          </div>
        </section>

        <!-- feed: posts down the left, a dot column beside each and an
             image circle in a dot cluster on the right -->
        <section class="tab" data-tab="feed" hidden>
          <div class="feed" id="feed"></div>
        </section>

        <!-- contacts: the projects field again, with the platforms in the
             grid and no view toggle above it -->
        <section class="tab" data-tab="contacts" hidden>
          <div class="projects-field">
            <div class="field-mount" id="contactsMount" aria-hidden="true"></div>
          </div>
        </section>

        <section class="tab" data-tab="all-music" hidden>
          <!-- The sub-nav is one pair of buttons whose words change with the
               view: soundtracks/side projects while the tracks are listed,
               genres/vibes once they're grouped. -->
          <nav class="music-subnav" aria-label="music sections">
            <button class="music-tab is-active" type="button" data-slot="a">soundtracks</button>
            <button class="music-tab" type="button" data-slot="b">side projects</button>
          </nav>

          <!-- Same pairing as the projects view toggle, with its own icons:
               the field of dots for every track, the smiley for the tags. -->
          <div class="music-view-toggle" role="group" aria-label="all music view">
            <button
              class="view-btn is-active"
              type="button"
              id="musicViewAllBtn"
              data-view="all"
              aria-label="all tracks"
            ></button>
            <button
              class="view-btn"
              type="button"
              id="musicViewTagsBtn"
              data-view="tags"
              aria-label="by genre and vibe"
            ></button>
          </div>

          <!-- Both halves are built once and swapped with `hidden`, so an
               open accordion (and the halo dots the wave drives) survives a
               trip through the other sub-tab. -->
          <div class="music-list" id="musicList">
            <div class="music-panel" id="musicSoundtracks"></div>
            <div class="music-panel" id="musicSideProjects" hidden></div>
          </div>

          <div class="music-tagfield" id="musicTagField" hidden>
            <div class="music-panel" id="musicGenres"></div>
            <div class="music-panel" id="musicVibes" hidden></div>
          </div>
        </section>
      </main>
    </div>

    <script src="./data.js?v=9"></script>
    <script src="./feed-data.js?v=22"></script>
    <script src="./music-data.js?v=25"></script>
    <script src="./field.js?v=64"></script>
    <script src="./app.js?v=94"></script>
  </body>
</html>

<!-- The smiley, rebuilt as a single alpha shape.

     Taken as it was drawn, this can't be a CSS mask: a mask reads alpha, and
     the eyes and the mouth are opaque dark paint rather than holes, so the
     whole thing would come out as one filled circle. Here the face is painted
     white through a mask that blacks those three out, which makes them
     genuine holes — so the button takes its colour from the palette exactly
     like the other two view icons do.

     The feTurbulence displacement is kept on all three, so the edges keep the
     same ragged quality as everything else on the page. -->
<svg width="71" height="71" viewBox="0 0 71 71" fill="none" xmlns="http://www.w3.org/2000/svg">
  <mask id="smile-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="71" height="71">
    <rect width="71" height="71" fill="black" />
    <g filter="url(#face_wobble)">
      <path
        d="M56.508 20.295C48.6913 9.08637 32.8732 6.6122 21.1772 14.7688C9.48125 22.9253 6.33651 38.6239 14.1532 49.8326C21.9699 61.0412 37.7881 63.5154 49.484 55.3588C61.18 47.2022 64.3247 31.5036 56.508 20.295Z"
        fill="white"
      />
    </g>
    <g filter="url(#eye_wobble_r)">
      <path
        d="M47.4615 23.7619C46.2624 22.7889 44.4772 23.0021 43.4741 24.2382C42.471 25.4743 42.6299 27.2651 43.8289 28.2382C45.028 29.2112 46.8132 28.998 47.8163 27.7619C48.8194 26.5258 48.6605 24.7349 47.4615 23.7619Z"
        fill="black"
      />
    </g>
    <g filter="url(#eye_wobble_l)">
      <path
        d="M27.8033 23.7619C26.6042 22.7889 24.819 23.0021 23.8159 24.2382C22.8128 25.4743 22.9717 27.2651 24.1707 28.2382C25.3698 29.2112 27.155 28.998 28.1581 27.7619C29.1612 26.5258 29.0023 24.7349 27.8033 23.7619Z"
        fill="black"
      />
    </g>
    <path
      d="M26 39C26 39 25.9978 51.5 34.4978 51.5C42.9978 51.5 45 39 45 39"
      stroke="black"
      stroke-width="5"
      stroke-linecap="round"
      fill="none"
    />
  </mask>

  <rect width="71" height="71" fill="white" mask="url(#smile-holes)" />

  <defs>
    <filter id="face_wobble" x="7.35645" y="7.46216" width="55.9482" height="55.2032" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix" />
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
      <feTurbulence type="fractalNoise" baseFrequency="0.035587187856435776 0.035587187856435776" numOctaves="3" seed="644" />
      <feDisplacementMap in="shape" scale="5" xChannelSelector="R" yChannelSelector="G" result="displacedImage" width="100%" height="100%" />
      <feMerge><feMergeNode in="displacedImage" /></feMerge>
    </filter>
    <filter id="eye_wobble_r" x="40.3145" y="20.6515" width="10.6611" height="10.697" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix" />
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
      <feTurbulence type="fractalNoise" baseFrequency="0.035587187856435776 0.035587187856435776" numOctaves="3" seed="644" />
      <feDisplacementMap in="shape" scale="5" xChannelSelector="R" yChannelSelector="G" result="displacedImage" width="100%" height="100%" />
      <feMerge><feMergeNode in="displacedImage" /></feMerge>
    </filter>
    <filter id="eye_wobble_l" x="20.6562" y="20.6515" width="10.6611" height="10.697" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix" />
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
      <feTurbulence type="fractalNoise" baseFrequency="0.035587187856435776 0.035587187856435776" numOctaves="3" seed="644" />
      <feDisplacementMap in="shape" scale="5" xChannelSelector="R" yChannelSelector="G" result="displacedImage" width="100%" height="100%" />
      <feMerge><feMergeNode in="displacedImage" /></feMerge>
    </filter>
  </defs>
</svg>
